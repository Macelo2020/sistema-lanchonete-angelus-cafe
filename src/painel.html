<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; padding: 20px; color: #333; }
    .container { max-width: 1000px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 4px 30px rgba(0,0,0,0.05); }
    
    .header-painel {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px 30px; border-radius: 12px; color: #fff;
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;
    }
    .header-painel h2 { font-size: 22px; font-weight: 700; margin: 0; }
    .header-painel p { font-size: 13px; opacity: 0.8; margin-top: 4px; }
    .menu-botoes { display: flex; gap: 10px; }
    .btn-menu {
      background: rgba(255,255,255,0.15); color: #fff; padding: 10px 18px;
      border: none; border-radius: 8px; font-size: 13px; font-weight: 600;
      cursor: pointer; text-decoration: none; transition: all 0.3s;
    }
    .btn-menu:hover { background: rgba(255,255,255,0.3); }
    .btn-menu.ativo { background: #fff; color: #764ba2; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    
    .filtros-box { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; display: flex; gap: 15px; align-items: flex-end; margin-bottom: 25px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; }
    .form-group input { padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
    .btn-acao { padding: 11px 22px; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.3s; }
    .btn-buscar-p { background: #5c6bc0; color: #fff; } .btn-buscar-p:hover { background: #3f51b5; }
    .btn-hoje { background: #ff9800; color: #fff; } .btn-hoje:hover { background: #f57c00; }
    .status-atualizado { margin-left: auto; font-size: 12px; color: #888; display: flex; align-items: center; gap: 5px; }
    .ponto-verde { width: 8px; height: 8px; background: #4caf50; border-radius: 50%; }

    .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
    .card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 12px; text-align: center; }
    .card .num { font-size: 28px; font-weight: 700; color: #333; margin-bottom: 4px; }
    .card .label { font-size: 11px; color: #94a3b8; font-weight: 700; text-transform: uppercase; }
    .card.destaque .num { color: #2e7d32; font-size: 30px; }

    .box-tabela { border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; }
    .titulo-tabela { background: #f8fafc; padding: 15px 20px; border-bottom: 1px solid #e2e8f0; font-size: 14px; font-weight: 700; color: #475569; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #5c6bc0; color: #fff; font-weight: 600; text-transform: uppercase; font-size: 11px; padding: 12px 15px; text-align: left; }
    td { padding: 12px 15px; border-bottom: 1px solid #f1f5f9; font-size: 13.5px; }
    tr:hover td { background: #f8fafc; }
    .badge-valor { background: #e8f5e9; color: #2e7d32; font-weight: 700; padding: 4px 8px; border-radius: 6px; font-size: 13px; }
    .badge-hora { background: #e3f2fd; color: #1565c0; font-weight: 600; padding: 3px 6px; border-radius: 6px; font-size: 12px; }
    .loading { text-align: center; padding: 40px; color: #94a3b8; }
  </style>
</head>
<body>
<div class="container">
  <div class="header-painel">
    <div>
      <h2>📊 Painel de Acompanhamento Diário</h2>
      <p>Lanchonete Angelus - Controle do RH</p>
    </div>
    <div class="menu-botoes">
      <a href="#" id="lnkPainel" class="btn-menu ativo">📊 Painel Diário</a>
      <a href="#" id="lnkRelatorio" class="btn-menu">📋 Relatório Mensal</a>
      <a href="#" id="lnkQrCode" class="btn-menu">📱 QR Codes</a>
    </div>
  </div>

  <div class="filtros-box">
    <div class="form-group"><label>📅 Data Início</label><input type="date" id="dtInicio"></div>
    <div class="form-group"><label>📅 Data Fim</label><input type="date" id="dtFim"></div>
    <button class="btn-acao btn-buscar-p" onclick="consultarPainel()">🔍 Buscar</button>
    <button class="btn-acao btn-hoje" onclick="definirDataHoje()">📌 Hoje</button>
    <div class="status-atualizado"><div class="ponto-verde"></div><span id="txtAtualizado">Atualizado: --:--:--</span></div>
  </div>

  <div class="cards-grid">
    <div class="card"><div class="num" id="cardRegs">0</div><div class="label">Registros</div></div>
    <div class="card"><div class="num" id="cardFuncs">0</div><div class="label">Funcionários</div></div>
    <div class="card destaque"><div class="num" id="cardTotal">R$ 0,00</div><div class="label">Valor Total</div></div>
  </div>

  <div class="box-tabela">
    <div class="titulo-tabela" id="titTabela">📋 Consumos do Dia</div>
    <table id="tblPainel">
      <thead>
        <tr>
          <th style="width: 50px; text-align:center;">#</th>
          <th>Data</th>
          <th>Hora</th>
          <th>Matrícula</th>
          <th>Nome</th>
          <th>Setor</th>
          <th>Valor</th>
          <th>Protocolo</th>
        </tr>
      </thead>
      <tbody id="corpoPainel"></tbody>
    </table>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    definirDataHoje(false);
    google.script.run.withSuccessHandler(function(url) {
      document.getElementById('lnkPainel').href = url + '?page=painel';
      document.getElementById('lnkRelatorio').href = url + '?page=relatorio';
      document.getElementById('lnkQrCode').href = url + '?page=qrcodes'; // Corrigido para qrcodes
      consultarPainel();
    }).getWebAppUrl();
  });

  function definirDataHoje(deveConsultar) {
    var hoje = new Date().toISOString().split('T')[0];
    document.getElementById('dtInicio').value = hoje;
    document.getElementById('dtFim').value = hoje;
    if(deveConsultar !== false) consultarPainel();
  }

  function consultarPainel() {
    var di = document.getElementById('dtInicio').value;
    var df = document.getElementById('dtFim').value;
    var tbody = document.getElementById('corpoPainel');
    tbody.innerHTML = '<tr><td colspan="8" class="loading">Buscando dados em tempo real...</td></tr>';

    google.script.run.withSuccessHandler(function(r) {
      tbody.innerHTML = '';
      if(r.sucesso && r.registros.length > 0) {
        document.getElementById('cardRegs').textContent = r.registros.length;
        document.getElementById('cardFuncs').textContent = [...new Set(r.registros.map(x => x.matricula))].length;
        document.getElementById('cardTotal').textContent = 'R$ ' + r.totalGeral.toFixed(2).replace('.', ',');

        r.registros.forEach(function(reg, idx) {
          var tr = document.createElement('tr');
          tr.innerHTML = '<td style="text-align:center; color:#94a3b8;">' + (idx + 1) + '</td>'
                       + '<td>' + reg.data + '</td>'
                       + '<td><span class="badge-hora">' + reg.hora + '</span></td>'
                       + '<td>' + reg.matricula + '</td>'
                       + '<td><strong>' + reg.nome + '</strong></td>'
                       + '<td>' + reg.setor + '</td>'
                       + '<td><span class="badge-valor">' + reg.valorFmt + '</span></td>'
                       + '<td style="color:#94a3b8; font-size:11px;">' + reg.protocolo + '</td>';
          tbody.appendChild(tr);
        });
      } else {
        tbody.innerHTML = '<tr><td colspan="8" class="loading">Nenhum consumo registrado neste período.</td></tr>';
      }
      document.getElementById('txtAtualizado').textContent = 'Atualizado: ' + new Date().toTimeString().split(' ')[0];
    }).buscarConsumosPorData(di, df);
  }
</script>
</body>
</html>
